<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPT 注册界面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <h1>SPT 用户注册</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
                </div>

                <div class="form-group">
                    <label for="verificationCode">验证码</label>
                    <div class="verification-group">
                        <input type="text" id="verificationCode" name="verificationCode" placeholder="请输入验证码" required>
                        <button type="button" id="sendCodeBtn" class="send-code-btn">发送验证码</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名 (3-20字符)" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码 (至少6字符)" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                </div>

                <div class="form-group">
                    <label for="version">选择版本</label>
                    <select id="version" name="version" required>
                        <option value="">请选择版本</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" id="registerBtn" class="register-btn">注册</button>
                </div>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
