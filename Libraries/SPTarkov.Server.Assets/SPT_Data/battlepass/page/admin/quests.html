<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商人任务管理 · 管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css?v=20260711-quests-v1" />
</head>
<body>
    <div class="grain"></div>

    <section id="login-view" class="view">
        <div class="login-card">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <h1 class="brand">商人任务管理</h1>
            <p class="brand-sub">TRADER&nbsp;QUESTS</p>
            <div class="field">
                <label>管理员密码</label>
                <input id="admin-pass" type="password" placeholder="管理员密码" />
            </div>
            <button id="admin-login-btn" class="btn primary">进入</button>
            <p id="admin-login-msg" class="msg"></p>
            <p class="brand-sub" style="margin-top:18px">与通行证后台共用管理员密码</p>
        </div>
    </section>

    <section id="quests-view" class="view hidden">
        <header class="topbar">
            <span class="season-name">商人任务管理</span>
            <nav class="tabs">
                <a class="tab" href="index.html">← 通行证后台</a>
                <a class="tab" href="items.html">物品管控 →</a>
            </nav>
            <button id="admin-logout" class="btn ghost small">登出</button>
        </header>

        <main class="admin-content">
            <div class="items-admin">
                <!-- 左：商人筛选 + 任务清单 -->
                <div class="panel">
                    <div class="panel-head"><h2>任务清单</h2></div>
                    <div class="form-body">
                        <div class="search-row">
                            <select id="q-trader"><option value="">全部商人</option></select>
                            <input id="q" placeholder="任务名 / questId（24位）" />
                            <button id="search-btn" class="btn primary small">搜索</button>
                        </div>
                        <div class="search-row" style="margin-top:8px">
                            <button id="new-quest-btn" class="btn ghost small">+ 新建自定义任务</button>
                        </div>
                        <div id="quest-rows" class="search-rows"></div>
                    </div>
                </div>

                <!-- 右：详情 / 图谱 / 编辑 -->
                <div class="panel">
                    <div class="panel-head"><h2 id="detail-title">任务详情</h2></div>
                    <div id="detail-body" class="form-body">
                        <p class="hint">在左侧选择商人并搜索任务，查看依赖图谱、完成条件与奖励，或禁用 / 编辑奖励；也可新建自定义商人任务。</p>
                    </div>
                </div>
            </div>
        </main>
    </section>

    <div id="toast" class="toast"></div>
    <script src="auth.js?v=20260707-pending-edit-v1"></script>
    <script src="picker.js?v=20260707-picker-v2"></script>
    <script src="quests.js?v=20260711-quests-v1"></script>
</body>
</html>
