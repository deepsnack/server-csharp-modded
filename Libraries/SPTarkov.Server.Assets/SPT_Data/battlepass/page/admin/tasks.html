<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通行证任务管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="grain"></div>

    <section id="login-view" class="view">
        <div class="login-card">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <h1 class="brand">通行证任务</h1>
            <p class="brand-sub">QUEST&nbsp;EDITOR</p>
            <div class="field">
                <label>管理员密码</label>
                <input id="admin-pass" type="password" placeholder="管理员密码" />
            </div>
            <button id="admin-login-btn" class="btn primary">进入</button>
            <p id="admin-login-msg" class="msg"></p>
            <p class="brand-sub" style="margin-top:18px">与通行证后台共用管理员密码</p>
        </div>
    </section>

    <section id="tasks-view" class="view hidden">
        <header class="topbar">
            <span class="season-name">通行证任务管理</span>
            <nav class="tabs">
                <a class="tab" href="index.html">← 管理后台</a>
            </nav>
            <button id="admin-logout" class="btn ghost small">登出</button>
        </header>

        <main class="admin-content task-layout">
            <!-- 左侧：任务列表 -->
            <aside class="task-list panel">
                <div class="panel-head"><h2>任务模板</h2><button id="new-task-btn" class="btn primary small">＋ 新建任务</button></div>
                <div id="task-rows"></div>
                <div class="refresh-box">
                    <div class="refresh-title">活跃任务刷新</div>
                    <div class="refresh-row">
                        <select id="refresh-scope">
                            <option value="daily">每日</option>
                            <option value="weekly">每周</option>
                            <option value="season">赛季</option>
                            <option value="all">全部</option>
                        </select>
                    </div>
                    <input id="refresh-profile" placeholder="Profile ID（留空批量）" />
                    <button id="refresh-active-tasks" class="btn ghost small">刷新任务</button>
                </div>

                <details class="task-settings-box" id="task-settings">
                    <summary>任务系统设置（全局）</summary>
                    <p class="hint" style="margin:8px 0">控制每位玩家抽取的随机任务数、自动刷新周期，以及主动刷新次数；固定任务始终额外加入。保存即写入当前赛季。</p>
                    <div class="ts-grid">
                        <label>每日随机任务数<input id="ts-daily-count" type="number" min="0" /></label>
                        <label>每周随机任务数<input id="ts-weekly-count" type="number" min="0" /></label>
                        <label>赛季随机任务数<span class="ts-sub">0=全部</span><input id="ts-season-count" type="number" min="0" /></label>
                        <label>主页同时显示<span class="ts-sub">其余滚动</span><input id="ts-display-count" type="number" min="1" /></label>
                        <label>每日刷新周期(时)<input id="ts-daily-period" type="number" min="0" step="0.5" /></label>
                        <label>每周刷新周期(时)<input id="ts-weekly-period" type="number" min="0" step="0.5" /></label>
                        <label>赛季刷新周期(时)<span class="ts-sub">0=不自动</span><input id="ts-season-period" type="number" min="0" step="0.5" /></label>
                        <label>每日免费刷新次数<input id="ts-daily-refresh" type="number" min="0" /></label>
                        <label>每周免费刷新次数<input id="ts-weekly-refresh" type="number" min="0" /></label>
                        <label>赛季免费刷新次数<span class="ts-sub">0=禁用</span><input id="ts-season-refresh" type="number" min="0" /></label>
                    </div>
                    <button id="save-task-settings" class="btn primary small" style="margin-top:8px">保存设置</button>
                    <span id="ts-msg" class="muted" style="margin-left:8px;font-size:11px"></span>
                </details>
            </aside>

            <!-- 右侧：编辑器 -->
            <section class="task-editor panel" id="editor-panel">
                <div class="panel-head"><h2 id="editor-title">任务编辑器</h2></div>
                <div class="form-body">

                    <!-- 类型卡片 -->
                    <div class="type-cards" id="type-cards">
                        <button class="type-card" data-ct="Kills">
                            <span class="tc-icon">🎯</span><span class="tc-label">击杀</span><span class="tc-desc">击杀指定阵营/条件敌人</span>
                        </button>
                        <button class="type-card" data-ct="Exploration">
                            <span class="tc-icon">🚪</span><span class="tc-label">撤离/生还</span><span class="tc-desc">进入地图并成功撤离</span>
                        </button>
                        <button class="type-card" data-ct="HandoverItem">
                            <span class="tc-icon">📦</span><span class="tc-label">上交物品</span><span class="tc-desc">上交指定物品给商人</span>
                        </button>
                        <button class="type-card" data-ct="FindItem">
                            <span class="tc-icon">🔍</span><span class="tc-label">寻找物品</span><span class="tc-desc">在战局中找到指定物品</span>
                        </button>
                        <button class="type-card" data-ct="PlaceItem">
                            <span class="tc-icon">📍</span><span class="tc-label">安放物品</span><span class="tc-desc">在某地安放/放置物品</span>
                        </button>
                        <button class="type-card" data-ct="VisitZone">
                            <span class="tc-icon">🗺️</span><span class="tc-label">到达地点</span><span class="tc-desc">去某地图的指定区域</span>
                        </button>
                    </div>

                    <!-- 基本信息 -->
                    <div class="form-row">
                        <div class="form-col grow">
                            <label>任务 ID</label>
                            <div class="input-btn-row">
                                <input id="f-id" placeholder="唯一标识，留空可自动生成" />
                                <button id="gen-id-btn" class="btn ghost small" title="按 scope + 类型自动生成">&#x21bb; 自动生成</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-row two-col">
                        <div class="form-col"><label>标题</label><input id="f-title" placeholder="任务标题" /></div>
                        <div class="form-col"><label>描述</label><input id="f-desc" placeholder="一句话描述" /></div>
                    </div>
                    <div class="form-row four-col">
                        <div class="form-col">
                            <label>范围</label>
                            <select id="f-scope"><option value="daily">每日</option><option value="weekly">每周</option><option value="season">赛季</option></select>
                        </div>
                        <div class="form-col">
                            <label>轮换</label>
                            <select id="f-rotation"><option value="random">随机池</option><option value="fixed">固定常驻</option></select>
                        </div>
                        <div class="form-col">
                            <label>BP 经验</label><input id="f-xp" type="number" value="500" />
                        </div>
                        <div class="form-col">
                            <label>权重（随机池）</label><input id="f-weight" type="number" value="1" />
                        </div>
                    </div>

                    <!-- 目标配置（按类型动态显示） -->
                    <div id="target-section" class="target-section"></div>

                    <!-- Kills 条件（仅 Kills 显示） -->
                    <section class="kill-conditions" id="kills-fine" style="display:none">
                        <div class="kill-conditions-head">
                            <strong>击杀条件</strong><span>所有已填写条件需同时满足；留空表示不限</span>
                        </div>
                        <div class="kill-condition-grid">
                            <div class="kill-condition-card">
                                <h3>目标</h3>
                                <label>目标阵营</label>
                                <select id="f-target"><option value="Any">任意敌人</option><option value="Savage">Scav</option><option value="AnyPmc">任意 PMC</option><option value="Bear">BEAR</option><option value="Usec">USEC</option><option value="Boss">Boss</option></select>
                                <label>Scav 角色</label>
                                <div class="tag-picker">
                                    <div class="tag-entry"><input id="f-savageroles-search" list="f-savageroles-options" placeholder="选择或输入角色后添加" /><button id="f-savageroles-add" type="button" class="btn ghost small">添加</button></div>
                                    <input id="f-savageroles" type="hidden" />
                                    <div id="f-savageroles-chips" class="multi-chips"></div>
                                    <datalist id="f-savageroles-options"><option value="assault"></option><option value="marksman"></option><option value="cursedAssault"></option><option value="exUsec"></option><option value="pmcBot"></option><option value="bossKilla"></option><option value="bossTagilla"></option><option value="bossBully"></option><option value="bossGluhar"></option><option value="bossSanitar"></option><option value="bossKojaniy"></option></datalist>
                                </div>
                            </div>

                            <div class="kill-condition-card">
                                <h3>武器</h3>
                                <label>指定武器</label>
                                <div class="multi-item-picker" data-field="f-weapons">
                                    <input id="f-weapons-search" placeholder="搜索武器名称或 tpl…" autocomplete="off" />
                                    <div id="f-weapons-results" class="ip-results" style="display:none"></div>
                                    <input id="f-weapons" type="hidden" />
                                    <div id="f-weapons-chips" class="multi-chips"></div>
                                </div>
                                <label>指定口径</label>
                                <div class="tag-picker">
                                    <div class="tag-entry"><input id="f-calibers-search" list="f-calibers-options" placeholder="选择或输入口径后添加" /><button id="f-calibers-add" type="button" class="btn ghost small">添加</button></div>
                                    <input id="f-calibers" type="hidden" />
                                    <div id="f-calibers-chips" class="multi-chips"></div>
                                    <datalist id="f-calibers-options"><option value="Caliber9x18PM"></option><option value="Caliber9x19PARA"></option><option value="Caliber9x21"></option><option value="Caliber45ACP"></option><option value="Caliber46x30"></option><option value="Caliber57x28"></option><option value="Caliber545x39"></option><option value="Caliber556x45NATO"></option><option value="Caliber762x25TT"></option><option value="Caliber762x35"></option><option value="Caliber762x39"></option><option value="Caliber762x51"></option><option value="Caliber762x54R"></option><option value="Caliber9x39"></option><option value="Caliber12g"></option><option value="Caliber20g"></option><option value="Caliber23x75"></option></datalist>
                                </div>
                            </div>

                            <div class="kill-condition-card">
                                <h3>命中与距离</h3>
                                <label>命中部位</label>
                                <div id="f-bodyparts" class="choice-grid">
                                    <label><input type="checkbox" value="Head" />头部</label><label><input type="checkbox" value="Chest" />胸部</label>
                                    <label><input type="checkbox" value="Stomach" />腹部</label><label><input type="checkbox" value="LeftArm" />左臂</label>
                                    <label><input type="checkbox" value="RightArm" />右臂</label><label><input type="checkbox" value="LeftLeg" />左腿</label>
                                    <label><input type="checkbox" value="RightLeg" />右腿</label>
                                </div>
                                <label>击杀距离（米）</label>
                                <div class="condition-pair distance-pair">
                                    <select id="f-distcompare"><option value="">不限</option><option value="&gt;=">至少</option><option value="&gt;">大于</option><option value="&lt;=">至多</option><option value="&lt;">小于</option><option value="=">等于</option></select>
                                    <input id="f-distval" type="number" min="0" step="1" placeholder="距离" />
                                </div>
                            </div>

                            <div class="kill-condition-card">
                                <h3>游戏时段</h3>
                                <p class="hint">支持跨午夜，例如 22:00 至 06:00。</p>
                                <div class="condition-pair">
                                    <div><label>开始</label><select id="f-daytimefrom"></select></div>
                                    <div><label>结束</label><select id="f-daytimeto"></select></div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <div class="form-actions">
                        <button id="save-task" class="btn primary">保存任务</button>
                        <button id="delete-task" class="btn del" style="display:none">删除</button>
                        <button id="clear-task" class="btn ghost">清空表单</button>
                    </div>
                </div>
            </section>
        </main>
    </section>

    <div id="toast" class="toast"></div>
    <script src="picker.js"></script>
    <script src="tasks.js"></script>
</body>
</html>
