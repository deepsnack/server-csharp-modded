<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务管理 · 通行证后台</title>
    <script>
        (function capturePortalAdminToken() {
            const params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
            const token = params.get('sso');
            if (!token) return;
            try {
                sessionStorage.setItem('bp_admin_token', token);
                sessionStorage.setItem('bp_actor_type', 'admin');
            } catch (_) {
                return;
            }
            params.delete('sso');
            params.delete('bpsso');
            const rest = params.toString();
            history.replaceState(null, '', location.pathname + location.search + (rest ? '#' + rest : ''));
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css?v=20260713-task-hub-v1" />
</head>
<body>
    <div class="grain"></div>

    <section id="login-view" class="view">
        <div class="login-card">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <h1 class="brand">任务管理</h1>
            <p class="brand-sub">TASK&nbsp;HUB</p>
            <div class="field">
                <label>管理员密码</label>
                <input id="admin-pass" type="password" placeholder="管理员密码" />
            </div>
            <button id="admin-login-btn" class="btn primary">进入</button>
            <p id="admin-login-msg" class="msg"></p>
            <p class="brand-sub" style="margin-top:18px">与通行证后台共用管理员密码</p>
        </div>
    </section>

    <section id="task-hub-view" class="view hidden">
        <header class="topbar">
            <span class="season-name">任务管理</span>
            <nav class="tabs">
                <a class="tab" href="index.html">← 管理后台</a>
                <button id="bp-task-tab" class="tab active" data-task-tab="bp">通行证任务</button>
                <button id="trader-task-tab" class="tab" data-task-tab="trader">商人任务</button>
                <a class="tab" href="items.html">物品管控 →</a>
            </nav>
            <button id="admin-logout" class="btn ghost small">登出</button>
        </header>

        <main class="task-hub-content">
            <iframe id="bp-task-frame" class="task-hub-frame" title="通行证任务" src="bp-tasks.html"></iframe>
            <iframe id="trader-task-frame" class="task-hub-frame hidden" title="商人任务" src="quests.html"></iframe>
        </main>
    </section>

    <div id="toast" class="toast"></div>
    <script src="auth.js?v=20260713-task-hub-v1"></script>
    <script src="tasks-hub.js?v=20260713-task-hub-v1"></script>
</body>
</html>
