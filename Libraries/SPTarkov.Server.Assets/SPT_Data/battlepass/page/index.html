<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>战斗通行证 · Battle Pass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="grain"></div>

    <!-- 登录 -->
    <section id="login-view" class="view">
        <div class="login-card">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <h1 class="brand">战斗通行证</h1>
            <p class="brand-sub">BATTLE&nbsp;PASS&nbsp;//&nbsp;OPERATOR&nbsp;ACCESS</p>
            <div class="field">
                <label>账号</label>
                <input id="login-username" type="text" autocomplete="username" placeholder="账号" />
            </div>
            <div class="field">
                <label>密码</label>
                <input id="login-password" type="password" autocomplete="current-password" placeholder="密码" />
            </div>
            <button id="login-btn" class="btn primary">接入 / LOGIN</button>
            <p id="login-msg" class="msg"></p>
        </div>
    </section>

    <!-- 主界面 -->
    <section id="main-view" class="view hidden">
        <header class="topbar player-topbar">
            <div class="season-info">
                <span class="season-name" id="season-name">—</span>
                <span class="season-timer" id="season-timer"></span>
            </div>
            <nav class="player-nav" aria-label="玩家功能导航">
                <a class="player-nav-link active" aria-current="page" href="index.html">通行证</a>
                <a class="player-nav-link" href="quest-skip.html">任务跳过</a>
                <a class="player-nav-link" href="lottery.html">抽奖</a>
                <a class="player-nav-link" href="titles.html">我的称号</a>
            </nav>
            <div class="level-block">
                <div class="level-badge">LV <span id="bp-level">1</span></div>
                <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div><span class="xp-text" id="xp-text"></span></div>
                <span class="premium-flag" id="premium-flag">免费轨</span>
            </div>
            <div class="user-block">
                <span id="bp-username"></span>
                <button id="admin-entry-btn" class="btn ghost small" style="display:none">管理</button>
                <button id="redeem-entry" class="btn ghost small">兑换激活码</button>
                <button id="logout-btn" class="btn ghost small">登出</button>
            </div>
        </header>

        <main class="content">
            <section id="compensation-panel" class="compensation-panel">
                <div class="compensation-copy">
                    <strong>奖励轨补偿</strong>
                    <span id="compensation-status">当前没有新增奖励</span>
                </div>
                <button id="compensation-btn" class="btn small compensation-btn" type="button" disabled>暂无可领取补偿</button>
            </section>

            <!-- 奖励轨 -->
            <section class="reward-section">
                <div class="rail-wrap">
                    <div class="rail-labels">
                        <div class="rail-label free">免费轨</div>
                        <div class="rail-label premium">付费轨</div>
                    </div>
                    <div class="rail-scroll" id="rail"></div>
                </div>

                <!-- 满级循环奖励（双轨 · 逐轮可领） -->
                <div id="cycle-section" class="cycle-section hidden">
                    <div class="cycle-head">
                        <h2>♾️ 循环奖励</h2>
                        <span id="cycle-sub" class="cycle-sub"></span>
                    </div>
                    <div class="cycle-preview">
                        <div class="cycle-track">
                            <span class="cyc-lbl free">免费轨每轮</span>
                            <div id="cycle-free-cell" class="cyc-cell"></div>
                            <button id="cycle-free-all" class="btn ghost small" type="button">一键领取（免费）</button>
                        </div>
                        <div class="cycle-track">
                            <span class="cyc-lbl premium">付费轨每轮</span>
                            <div id="cycle-premium-cell" class="cyc-cell"></div>
                            <button id="cycle-premium-all" class="btn ghost small" type="button">一键领取（付费）</button>
                        </div>
                    </div>
                    <div id="cycle-rounds" class="cycle-rounds"></div>
                </div>
            </section>

            <!-- 任务 -->
            <section class="panel tasks-section">
                <div class="panel-head">
                    <h2>任务</h2>
                    <div class="task-tools">
                        <button id="refresh-daily" class="t-reroll" type="button">刷新每日</button>
                        <button id="refresh-weekly" class="t-reroll" type="button">刷新每周</button>
                        <button id="refresh-season" class="t-reroll" type="button">刷新赛季</button>
                    </div>
                </div>
                <div id="task-list" class="task-list"></div>
            </section>

            <!-- 通行证商店 -->
            <section class="panel shop-section">
                <div class="panel-head">
                    <h2>通行证商店</h2>
                    <input id="shop-search" class="shop-search" type="search" placeholder="搜索商品" autocomplete="off" />
                    <span id="shop-next-refresh" class="muted"></span>
                    <button id="shop-refresh" class="t-reroll" type="button">刷新</button>
                </div>
                <nav id="shop-categories" class="shop-categories" aria-label="商品分类筛选"></nav>
                <div id="shop-list" class="shop-list"></div>
                <div class="shop-more-wrap"><button id="shop-more" class="btn ghost small" type="button" style="display:none">展开更多</button></div>
            </section>
        </main>
    </section>

    <!-- 兑换激活码弹窗（与前端风格一致，非浏览器原生弹窗） -->
    <div id="redeem-overlay" class="rw-overlay hidden">
        <div class="rw-overlay-box redeem-box">
            <div class="rw-overlay-head"><span>兑换激活码</span><button id="redeem-close" type="button">×</button></div>
            <div class="redeem-modal">
                <input id="redeem-code" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" />
                <button id="redeem-btn" class="btn primary small">兑换</button>
                <p id="redeem-msg" class="msg"></p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="script.js?v=20260711-shop-icon-fallback"></script>
</body>
</html>
