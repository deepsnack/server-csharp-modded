<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPT // 注册管理控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Saira:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grain" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <div class="container">

        <!-- 登录面板 -->
        <div class="admin-box" id="loginPanel" style="display:none;">
            <span class="corner tl" aria-hidden="true"></span>
            <span class="corner tr" aria-hidden="true"></span>
            <span class="corner bl" aria-hidden="true"></span>
            <span class="corner br" aria-hidden="true"></span>

            <div class="topbar">
                <span class="status-dot warn"></span>
                <span class="topbar-text">RESTRICTED&nbsp;·&nbsp;需要授权</span>
            </div>

            <header class="masthead">
                <div class="brand">
                    <span class="brand-mark">SPT</span>
                    <span class="brand-tag">// 管理员认证</span>
                </div>
                <p class="brand-sub">ADMIN AUTHENTICATION REQUIRED</p>
            </header>

            <div class="form-group">
                <label for="adminPassword">管理员密码 <span class="ftag">ROOT KEY</span></label>
                <input type="password" id="adminPassword" placeholder="••••••••">
            </div>
            <div class="form-group">
                <button id="loginBtn" class="primary-btn block" onclick="adminLogin()">
                    <span class="btn-label">登&nbsp;录</span><span class="btn-sub">AUTH</span>
                </button>
            </div>
            <div id="loginMessage" class="message"></div>

            <div class="back-link-bar">
                <a href="/register/index.html" class="back-link">← 返回注册终端</a>
            </div>
        </div>

        <!-- 管理面板 -->
        <div class="admin-box wide" id="adminPanel" style="display:none;">
            <span class="corner tl" aria-hidden="true"></span>
            <span class="corner tr" aria-hidden="true"></span>
            <span class="corner bl" aria-hidden="true"></span>
            <span class="corner br" aria-hidden="true"></span>

            <div class="topbar">
                <span class="status-dot"></span>
                <span class="topbar-text">SESSION&nbsp;ACTIVE&nbsp;·&nbsp;已授权</span>
                <button class="logout-btn" onclick="adminLogout()">[ 退出登录 ]</button>
            </div>

            <header class="masthead">
                <div class="brand">
                    <span class="brand-mark">SPT</span>
                    <span class="brand-tag">// 注册管理控制台</span>
                </div>
                <p class="brand-sub">REGISTRATION CONTROL CONSOLE</p>
            </header>

            <!-- 版本管理区 -->
            <section class="section">
                <h2><span class="sec-no">01</span> 版本管理 <span class="sec-en">EDITION ACCESS</span></h2>
                <p class="section-desc">勾选普通玩家注册时可见的版本。<strong>不勾选任何版本 = 允许全部版本。</strong></p>
                <div id="versionCheckList" class="check-list"></div>
                <div class="section-actions">
                    <button class="primary-btn" onclick="saveAllowedVersions()">保存版本设置</button>
                </div>
                <div id="versionMessage" class="message"></div>
            </section>

            <!-- 预注册管理区 -->
            <section class="section">
                <h2><span class="sec-no">02</span> 预注册管理 <span class="sec-en">PRE-ENROLLMENT</span></h2>
                <p class="section-desc">为指定邮箱预分配版本，预注册玩家完成注册后版本将被锁定。</p>
                <div class="preregister-form">
                    <input type="email" id="preEmail" placeholder="玩家邮箱">
                    <div class="select-wrap">
                        <select id="preVersion">
                            <option value="">选择版本</option>
                        </select>
                    </div>
                    <button class="primary-btn" onclick="addPreRegistration()">添加</button>
                </div>
                <div id="preregMessage" class="message"></div>
                <table id="preregTable" class="preg-table">
                    <thead>
                        <tr><th>邮箱</th><th>锁定版本</th><th>操作</th></tr>
                    </thead>
                    <tbody id="preregBody"></tbody>
                </table>
            </section>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
