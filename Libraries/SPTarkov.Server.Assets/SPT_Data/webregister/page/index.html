<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPT // 用户注册终端</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Saira:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grain" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <div class="container">
        <div class="register-box">
            <span class="corner tl" aria-hidden="true"></span>
            <span class="corner tr" aria-hidden="true"></span>
            <span class="corner bl" aria-hidden="true"></span>
            <span class="corner br" aria-hidden="true"></span>

            <div class="topbar">
                <span class="status-dot"></span>
                <span class="topbar-text">SECURE&nbsp;LINK&nbsp;·&nbsp;连接已加密</span>
                <a href="/register/admin/index.html" class="admin-link">[ 管理员入口 ]</a>
            </div>

            <header class="masthead">
                <div class="brand">
                    <span class="brand-mark">SPT</span>
                    <span class="brand-tag">// 用户注册终端</span>
                </div>
                <p class="brand-sub">OPERATOR ENROLLMENT &nbsp;—&nbsp; 创建你的逃离塔科夫账户</p>
            </header>

            <form id="registerForm" novalidate>
                <div class="form-group" style="--i:1">
                    <label for="email">邮箱 <span class="ftag">E-MAIL</span></label>
                    <input type="email" id="email" name="email" placeholder="operator@domain.com" required>
                </div>

                <div class="form-group" style="--i:2">
                    <label for="verificationCode">验证码 <span class="ftag">AUTH-CODE</span></label>
                    <div class="verification-group">
                        <input type="text" id="verificationCode" name="verificationCode" placeholder="• • • • • •" required>
                        <button type="button" id="sendCodeBtn" class="send-code-btn">发送验证码</button>
                    </div>
                </div>

                <div class="form-group" style="--i:3">
                    <label for="username">用户名 <span class="ftag">CALLSIGN · 3-20</span></label>
                    <input type="text" id="username" name="username" placeholder="callsign" required>
                    <span id="usernameHint" class="field-hint" style="display:none;"></span>
                </div>

                <div class="form-group" style="--i:4">
                    <label for="password">密码 <span class="ftag">PASSPHRASE · 6+</span></label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-group" style="--i:5">
                    <label for="confirmPassword">确认密码 <span class="ftag">CONFIRM</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                </div>

                <div class="form-group" style="--i:6">
                    <label for="activationCode">激活码 <span class="ftag">ACTIVATION · 选填</span></label>
                    <input type="text" id="activationCode" name="activationCode" placeholder="XXXX-XXXX-XXXX（无码可留空）" autocomplete="off">
                    <span id="activationHint" class="field-hint" style="display:none;"></span>
                </div>

                <div class="form-group" style="--i:7">
                    <label for="version">选择版本 <span class="ftag">EDITION</span></label>
                    <div class="select-wrap">
                        <select id="version" name="version" required>
                            <option value="">— 请选择版本 —</option>
                        </select>
                    </div>
                    <span id="versionLockNote" class="version-lock-note" style="display:none;">⚿ 版本已由管理员锁定</span>
                </div>

                <div class="form-group" style="--i:8">
                    <button type="submit" id="registerBtn" class="register-btn">
                        <span class="btn-label">注&nbsp;册</span>
                        <span class="btn-sub">ENLIST</span>
                    </button>
                </div>
            </form>

            <div id="message" class="message"></div>

            <div class="aux-links">
                <a href="/register/reset.html" class="aux-link">忘记密码？<span>RECOVER PASSPHRASE →</span></a>
            </div>

            <footer class="formfoot">
                <span>SPT&nbsp;REGISTRATION&nbsp;SERVICE</span>
                <span class="blink">█</span>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
