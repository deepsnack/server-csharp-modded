<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPT // 重置存档</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Saira:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grain" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <div class="container">
        <div class="register-box">
            <span class="corner tl" aria-hidden="true"></span>
            <span class="corner tr" aria-hidden="true"></span>
            <span class="corner bl" aria-hidden="true"></span>
            <span class="corner br" aria-hidden="true"></span>

            <div class="topbar">
                <span class="status-dot warn"></span>
                <span class="topbar-text">SECURE&nbsp;LINK&nbsp;·&nbsp;连接已加密</span>
                <a href="/register/index.html" class="admin-link">[ 返回注册 ]</a>
            </div>

            <header class="masthead">
                <div class="brand">
                    <span class="brand-mark">SPT</span>
                    <span class="brand-tag">// 重置存档</span>
                </div>
                <p class="brand-sub">PROFILE SOFT-RESET &nbsp;—&nbsp; 清空游戏进度，保留账号与邮箱</p>
            </header>

            <p class="reset-warn">⚠ 软重置将清空角色、物品、任务、藏身处等<strong>全部游戏进度</strong>并重新开荒；你的<strong>账号、密码和注册邮箱将保留</strong>，无需重新注册。此操作不可恢复。</p>

            <form id="softResetForm" novalidate>
                <div class="form-group" style="--i:1">
                    <label for="username">用户名 <span class="ftag">CALLSIGN</span></label>
                    <input type="text" id="username" name="username" placeholder="callsign" autocomplete="username" required>
                </div>

                <div class="form-group" style="--i:2">
                    <label for="password">密码 <span class="ftag">PASSPHRASE</span></label>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <div class="form-group" style="--i:3">
                    <label class="confirm-check">
                        <input type="checkbox" id="confirmReset">
                        我已知晓游戏进度将被清空且不可恢复
                    </label>
                </div>

                <div class="form-group" style="--i:4">
                    <button type="submit" id="softResetBtn" class="register-btn danger">
                        <span class="btn-label">重&nbsp;置&nbsp;存&nbsp;档</span>
                        <span class="btn-sub">SOFT RESET</span>
                    </button>
                </div>
            </form>

            <div id="message" class="message"></div>

            <div class="aux-links">
                <a href="/register/reset.html" class="aux-link">忘记密码？<span>RECOVER PASSPHRASE →</span></a>
            </div>

            <footer class="formfoot">
                <span>SPT&nbsp;PROFILE&nbsp;SOFT-RESET</span>
                <span class="blink">█</span>
            </footer>
        </div>
    </div>

    <script src="softreset.js"></script>
</body>
</html>
